output_dir: /tmp/out
phases:
  hello:
    label: "Hello phase"
    runner: { kind: java, class: forge.transformations.phase.HelloPhase }
    args: { name: world }
  goodbye:
    label: "Goodbye phase"
    runner: { kind: java, class: forge.transformations.phase.GoodbyePhase }
    depends_on: [hello]
