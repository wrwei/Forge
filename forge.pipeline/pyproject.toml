[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-pipeline"
version = "1.0.0"
description = "Forge: the deterministic pipeline phases and the vacuity audit"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0", "jsonschema>=4.20.0", "ruamel.yaml>=0.18"]

[project.scripts]
forge-pipeline = "forge_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["forge_pipeline*"]

[tool.setuptools.package-data]
forge_pipeline = ["manifest.schema.json", "csp/data/*.json", "csp/data/*.csp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
